<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Sanguchería</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f5f3ef;
      color: #242424;
    }

    .tarjeta {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: white;
      border: 1px solid #e6e1da;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
    }

    .marca {
      margin: 0 0 24px;
      color: #a33920;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .descripcion {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-bottom: 20px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 3px solid #f4d4c9;
      border-color: #a33920;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #a33920;
      color: white;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #822c18;
    }

    button:focus-visible {
      outline: 3px solid #242424;
      outline-offset: 3px;
    }

    .pie {
      margin: 24px 0 0;
      text-align: center;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="tarjeta">
    <p class="marca">SANGUCHERÍA · ATENCIÓN AL CLIENTE</p>

    <h1>Iniciar sesión</h1>
    <p class="descripcion">
      Ingresa para registrar una incidencia y consultar el estado de tus tickets.
    </p>
    <form id="form-login" action="/login" method="POST">
  <label for="correo">Correo electrónico</label>
  <input
    type="email"
    id="correo"
    name="correo"
    placeholder="Ejemplo: cliente@correo.com"
    autocomplete="username"
    required
  >

  <label for="password">Contraseña</label>
  <input
    type="password"
    id="password"
    name="password"
    placeholder="Ingresa tu contraseña"
    autocomplete="current-password"
    required
  >

  <p
    id="mensaje-error"
    role="alert"
    style="color: #a33920;"
    hidden
  >
    Correo o contraseña incorrectos.
  </p>

  <button type="submit" id="btn-login">
    Iniciar sesión
  </button>
</form>

<script>
  const parametros = new URLSearchParams(window.location.search);

  if (parametros.get('error') === '1') {
    document.getElementById('mensaje-error').hidden = false;
  }
</script>

    <p class="pie">Sistema de gestión de tickets</p>
  </main>
</body>
</html>
